name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Get the latest source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t asanka2002/cloud-url-shortener-backend:latest \
            -t asanka2002/cloud-url-shortener-backend:${{ github.sha }} \
            .

      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push asanka2002/cloud-url-shortener-backend:latest
          docker push asanka2002/cloud-url-shortener-backend:${{ github.sha }}

      # 5. Deploy to EC2
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          # Ensure clean UNIX line endings for the private key
          printf "%s\n" "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Connect to EC2 and deploy container
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/ec2_key \
            "$EC2_USERNAME@$EC2_HOST" << EOF
            set -e

            echo "Logging into Docker Hub on EC2..."
            echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "Pulling latest image..."
            sudo docker pull asanka2002/cloud-url-shortener-backend:latest

            echo "Stopping old container if exists..."
            sudo docker stop cloud-url-shortener-backend || true
            sudo docker rm cloud-url-shortener-backend || true

            echo "Starting new container..."
            # Check if ~/.env exists, otherwise run without env-file or with defaults
            if [ -f "\$HOME/.env" ]; then
              sudo docker run -d \
                --name cloud-url-shortener-backend \
                --env-file "\$HOME/.env" \
                -p 5000:5000 \
                --restart unless-stopped \
                asanka2002/cloud-url-shortener-backend:latest
            else
              sudo docker run -d \
                --name cloud-url-shortener-backend \
                -p 5000:5000 \
                --restart unless-stopped \
                asanka2002/cloud-url-shortener-backend:latest
            fi

            echo "Pruning unused images..."
            sudo docker image prune -f

            echo "Deployment successful!"
          EOF